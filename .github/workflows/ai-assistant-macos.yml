name: VectorCraft macOS AI Assistant build

on:
  workflow_dispatch:
  push:
    branches: [ai-assistant]

permissions:
  contents: read

concurrency:
  group: vectorcraft-ai-assistant-macos
  cancel-in-progress: true

jobs:
  macos-app:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build unsigned VectorCraft.app
        run: cargo xtask bundle
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/VectorCraft.app" "dist/VectorCraft-AI-Assistant-macos.zip"
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: VectorCraft-AI-Assistant-macos
          path: dist/VectorCraft-AI-Assistant-macos.zip
          if-no-files-found: error
